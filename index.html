  <body class="bg-[#08080A] text-white font-sans antialiased selection:bg-[#C6FF00] selection:text-[#08080A] overflow-x-hidden">
    <div id="root"></div>

    <!-- Script de entrada para o Vite Dev Server -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Fallback automático para abertura direta (file:/// ou Live Server/preview estático) -->
    <script>
      (function() {
        const isFileProtocol = window.location.protocol === 'file:';
        
        function loadFallbackBundle() {
          const root = document.getElementById('root');
          if (root && root.children.length === 0) {
            console.log('Ambiente estático detectado. Carregando bundle compilado da ODomoFit...');
            
            // Injetar CSS compilado
            if (!document.querySelector('link[href*="index-"]')) {
              const link = document.createElement('link');
              link.rel = 'stylesheet';
              link.href = './dist/assets/index-BfqkuNQY.css';
              document.head.appendChild(link);
            }

            // Injetar JS compilado
            const script = document.createElement('script');
            script.type = 'module';
            script.crossOrigin = 'anonymous';
            script.src = './dist/assets/index-BCLVIffT.js';
            document.body.appendChild(script);
          }
        }

        if (isFileProtocol) {
          // Se aberto via protocolo file:///, carregar imediatamente
          loadFallbackBundle();
        } else {
          // Se aberto via HTTP (ex: Live Server ou outro servidor estático sem Vite)
          window.addEventListener('DOMContentLoaded', function() {
            setTimeout(loadFallbackBundle, 300);
          });
        }
      })();
    </script>
  </body>
