    <link rel="apple-touch-icon" href="./images/app-icons.png" />

    <meta property="twitter:card" content="summary_large_image" />

    <meta property="twitter:description" content="Organize seus treinos, acompanhe sua evolução e alcance o mais alto nível com o ODomoFit." />
    <meta property="twitter:image" content="/images/gym_hero_bg.jpg" />

    <!-- Google Fonts: Oswald, Bebas Neue, Montserrat, Plus Jakarta Sans, Syne, Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700;800;900&family=Oswald:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800;900&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
  </head>
  <body class="bg-[#08080A] text-white font-sans antialiased selection:bg-[#C6FF00] selection:text-[#08080A] overflow-x-hidden">
    <div id="root"></div>

    <!-- Script de entrada para o Vite Dev Server -->

    <!-- Gerenciador inteligente de ambiente (Dev Server, Live Server, Servidor Estático ou file://) -->
    <script>
      (function() {
        const isFileProtocol = window.location.protocol === 'file:';
        const root = document.getElementById('root');

        if (isFileProtocol) {
          // Se aberto diretamente via duplo clique no arquivo (file:///):
          // 1. Tentar detectar se o servidor de desenvolvimento local (Vite) já está ligado
          fetch('http://localhost:5174/', { mode: 'no-cors' })
            .then(function() {
              console.log('Servidor ODomoFit detectado em http://localhost:5174/! Redirecionando...');
              window.location.href = 'http://localhost:5174/';
            })
            .catch(function() {
              // Servidor local não está rodando. Exibir interface guia visual moderna ODomoFit
              setTimeout(function() {
                if (root && root.children.length === 0) {
                  root.innerHTML = `
                    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #08080A; color: #fff; font-family: 'Montserrat', sans-serif; padding: 24px; box-sizing: border-box;">
                      <div style="max-width: 580px; width: 100%; background: #121318; border: 1px solid rgba(198, 255, 0, 0.25); border-radius: 20px; padding: 40px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(198, 255, 0, 0.08);">
                        <div style="display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 16px; background: rgba(198, 255, 0, 0.1); border: 1px solid #C6FF00; margin-bottom: 24px;">
                          <span style="color: #C6FF00; font-size: 28px; font-weight: 900;">⚡</span>
                        </div>
                        <h1 style="font-family: 'Oswald', sans-serif; font-size: 32px; font-weight: 700; text-transform: uppercase; margin: 0 0 12px 0; color: #fff; letter-spacing: 0.5px;">
                          ODOMOFIT <span style="color: #C6FF00;">WEB</span>
                        </h1>
                        <p style="color: #9FA1AC; font-size: 14px; line-height: 1.6; margin: 0 0 28px 0;">
                          Você abriu o site diretamente pelo explorador de arquivos (<code style="background: rgba(255,255,255,0.08); padding: 3px 8px; border-radius: 6px; color: #C6FF00;">file:///</code>). Os navegadores modernos (Chrome, Edge) exigem um servidor web para carregar aplicações React completas com animações e áudio.
                        </p>
                        <div style="background: #08080A; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 18px; margin-bottom: 28px; text-align: left;">
                          <div style="color: #fff; font-size: 13px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 8px;">
                            <span style="color: #C6FF00;">▶</span> Como iniciar em 1 clique:
                          </div>
                          <ol style="margin: 0; padding-left: 20px; color: #9FA1AC; font-size: 13px; line-height: 1.7;">
                            <li>Abra a pasta <b style="color: #fff;">ODomoFit</b> no seu computador.</li>
                            <li>Dê dois cliques no arquivo <b style="color: #C6FF00;">abrir_site.bat</b>.</li>
                            <li>O site abrirá automaticamente com todas as interações!</li>
                          </ol>
                        </div>
                        <a href="http://localhost:5174/" style="display: block; width: 100%; padding: 14px 24px; background: #C6FF00; color: #08080A; text-decoration: none; border-radius: 12px; font-weight: 800; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; transition: transform 0.2s, box-shadow 0.2s; box-sizing: border-box; box-shadow: 0 4px 20px rgba(198, 255, 0, 0.35);">
                          Já iniciei o servidor, Abrir ODomoFit
                        </a>
                      </div>
                    </div>
                  `;
                }
              }, 400);
            });
        } else {
          // Se aberto via HTTP (Live Server, VS Code preview ou servidor estático sem Vite):
          window.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
              if (root && root.children.length === 0) {
                console.log('Ambiente estático detectado. Carregando bundle compilado da ODomoFit...');
                
                // Injetar CSS compilado oficial
                if (!document.querySelector('link[href*="index.css"]')) {
                  const link = document.createElement('link');
                  link.rel = 'stylesheet';
                  link.href = './dist/assets/index.css';
                  document.head.appendChild(link);
                }

                // Injetar JS compilado oficial
                if (!document.querySelector('script[src*="index.js"]')) {
                  const script = document.createElement('script');
                  script.type = 'module';
                  script.crossOrigin = 'anonymous';
                  script.src = './dist/assets/index.js';
                  document.body.appendChild(script);
                }
              }
            }, 500);
          });
        }
      })();
    </script>
  </body>
</html>
